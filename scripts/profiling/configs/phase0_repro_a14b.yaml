# Phase 0 reproducibility check — B0 × 5 runs on T2V-A14B.
# Per the plan: confirm CV(diffusion_s) < 3% before kicking off Phase 1 matrix.
# If exceeded, investigate (fragmentation / thermal / neighbor process) first.
#
# 5 runs of one config = 5 generations × ~2 min = ~10 min wall.

defaults:
  task: t2v-A14B
  ckpt_dir: /workspace/Wan2.2-T2V-A14B
  size: "832*480"
  frame_num: 81
  sample_steps: 40
  prompt: "Two anthropomorphic cats in comfy boxing gear and bright gloves fight intensely on a spotlighted stage."
  base_seed: 42
  out_root: /workspace/profile_outputs/phase0_repro_a14b
  runs: 5
  skip_first: true

env_defaults:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  TORCHINDUCTOR_CACHE_DIR: /workspace/.compile_cache
  WAN_PROFILE_FLUSH_INTERVAL: "1"

configs:
  # HF ships A14B weights as fp32 (54 GB per DiT). --convert_model_dtype is
  # required to cast to bf16, else 108 GB OOM on H100 80GB.
  - name: B0_uly2_bf16
    nproc: 2
    args: ["--ulysses_size", "2", "--convert_model_dtype"]
