# Phase 3 — torch.compile mode tuning on Y4 (CFG-parallel-2 + offload).
# Default mode (Y5) drifted 28.4 dB from Y1. Try other modes to see if
# we can keep speedup with less drift.
#
# 2 configs × 3 runs ≈ ~104 min wall.

defaults:
  task: t2v-A14B
  ckpt_dir: /workspace/Wan2.2-T2V-A14B
  size: "1280*720"
  frame_num: 81
  sample_steps: 40
  prompt: "Two anthropomorphic cats in comfy boxing gear and bright gloves fight intensely on a spotlighted stage."
  base_seed: 42
  out_root: /workspace/profile_outputs/phase3_compile_modes
  runs: 3
  skip_first: true

env_defaults:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  TORCHINDUCTOR_CACHE_DIR: /workspace/.compile_cache
  WAN_PROFILE_FLUSH_INTERVAL: "1"

configs:
  - name: Y6_cfg2_compile_reduce_overhead
    nproc: 2
    args: ["--cfg_parallel_size", "2", "--convert_model_dtype",
           "--offload_model", "True", "--compile_model",
           "--compile_mode", "reduce-overhead"]

  - name: Y7_cfg2_compile_max_autotune
    nproc: 2
    args: ["--cfg_parallel_size", "2", "--convert_model_dtype",
           "--offload_model", "True", "--compile_model",
           "--compile_mode", "max-autotune"]
