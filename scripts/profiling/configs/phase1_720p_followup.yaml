# Phase 1 — 720p follow-up: lossless-stack candidates layered on top of
# whichever Y1/Y4 wins. Y5 = CFG-parallel + offload + compile.
# Run after phase1_720p.yaml so we know which baseline to extend.

defaults:
  task: t2v-A14B
  ckpt_dir: /workspace/Wan2.2-T2V-A14B
  size: "1280*720"
  frame_num: 81
  sample_steps: 40
  prompt: "Two anthropomorphic cats in comfy boxing gear and bright gloves fight intensely on a spotlighted stage."
  base_seed: 42
  out_root: /workspace/profile_outputs/phase1_720p
  runs: 3
  skip_first: true

env_defaults:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  TORCHINDUCTOR_CACHE_DIR: /workspace/.compile_cache
  WAN_PROFILE_FLUSH_INTERVAL: "1"

configs:
  # Y5: CFG-parallel + offload + compile. Most aggressive lossless config:
  # one DiT GPU-resident, full activations per rank (no Ulysses split),
  # compile-fused kernels. ~35 GB headroom for inductor scratch.
  - name: Y5_cfg2_bf16_offload_compile
    nproc: 2
    args: ["--cfg_parallel_size", "2", "--convert_model_dtype", "--offload_model", "True", "--compile_model"]
